<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workov toy office (design A)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
  :root { --ink:#2a2140; --muted:#6f5f86; --paper:rgba(255,248,235,.96); --line:#2a2140; --accent:#ff5a4e; --r:16px; }
  html,body { margin:0; height:100%; background:#cdeeff; font:13px/1.4 "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; color:var(--ink); overflow:hidden; }
  ::selection { background:#ffd84d; color:#2a2140; }
  canvas { display:block; width:100%; height:100%; cursor:grab; touch-action:none; }
  canvas:active { cursor:grabbing; }
  #hud { position:fixed; left:16px; top:16px; background:var(--paper); border:2px solid var(--line); border-radius:var(--r); padding:14px 16px; min-width:236px; box-shadow:0 10px 28px rgba(42,33,64,.18), 0 2px 0 rgba(42,33,64,.08); }
  #hud h1 { font-size:20px;font-weight:800;letter-spacing:-.02em; margin:0 0 3px; line-height:1.15; text-wrap:balance; }
  #hud p { margin:0 0 10px; color:var(--muted); font-size:12px; max-width:30ch; }
  .row { display:flex; justify-content:space-between; gap:18px; padding:2.5px 0; }
  .row b { font-variant-numeric:tabular-nums; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; vertical-align:-1px; }
  #tools { position:fixed; right:16px; top:16px; display:flex; gap:8px; }
  button { font:inherit; font-weight:600; color:#2a2140; background:#fff; border:2px solid var(--line); border-radius:999px; padding:7px 14px; cursor:pointer; box-shadow:0 10px 28px rgba(42,33,64,.18), 0 2px 0 rgba(42,33,64,.08); transition:border-color .18s cubic-bezier(.16,1,.3,1), transform .18s cubic-bezier(.16,1,.3,1); }
  button:hover { border-color:#ff5a4e; transform:translateY(-1px); }
  button:focus-visible { outline:2px solid #ff5a4e; outline-offset:2px; }
  #log { position:fixed; left:16px; bottom:16px; width:340px; max-height:176px; overflow:hidden; background:var(--paper); border:2px solid var(--line); border-radius:var(--r); padding:11px 14px; font-size:12px; box-shadow:0 10px 28px rgba(42,33,64,.18), 0 2px 0 rgba(42,33,64,.08); }
  #log div { padding:1.5px 0; color:var(--muted); } #log div:first-child { color:var(--ink); font-weight:700; }
  #log time { color:var(--muted); opacity:.75; margin-right:7px; font-variant-numeric:tabular-nums; }
  .lbl { position:fixed; left:0; top:0; transform:translate(-50%,-100%); pointer-events:none; text-align:center; white-space:nowrap; will-change:transform; }
  .lbl .name { display:inline-block; background:#fff; color:var(--ink); border:2px solid #2a2140; border-radius:999px; padding:1px 10px; font-weight:700; font-size:11px; box-shadow:0 3px 8px rgba(0,0,0,.18); }
  .lbl .name small { display:none; }
  .lbl .say { display:block; margin:4px auto 0; max-width:210px; overflow:hidden; text-overflow:ellipsis; background:#2a2140; color:#fff6e6; border-radius:9px; padding:2px 9px; font-size:10.5px; font-weight:600; }
  .lbl .say.you { background:#ff5a4e; color:#fff; }
  .lbl .say.zzz { background:#fff; color:#6f5f86; font-weight:500; }
  .zone { position:fixed; left:0; top:0; transform:translate(-50%,-50%); pointer-events:none; font-family:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; font-weight:800; letter-spacing:.12em; font-size:11px; color:rgba(42,33,64,.7);  text-transform:uppercase; }
  .note { position:fixed; right:16px; bottom:16px; font-size:11px; color:var(--muted); background:var(--paper); border-radius:999px; padding:5px 11px; }
  .night #hud,.night #log{background:rgba(42,33,64,.94);color:#fff6e6;border-color:#fff6e6}.night #log div{color:#d9cdf0}.night #log div:first-child{color:#fff}.night .zone{color:rgba(255,246,230,.8)}.night .note{background:rgba(42,33,64,.8);color:#d9cdf0}.night button{background:#3a2e58;color:#fff6e6;border-color:#fff6e6}
  .ts{position:fixed;left:0;right:0;height:17vh;pointer-events:none;backdrop-filter:blur(5px)}.ts-top{top:0;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}.ts-bot{bottom:0;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
  @media (max-width: 640px) {
    #hud { left:10px; top:10px; right:10px; min-width:0; padding:10px 12px; display:grid; grid-template-columns:1fr 1fr; column-gap:16px; }
    #hud h1, #hud p { grid-column:1 / -1; } #hud p { margin-bottom:6px; max-width:none; }
    #tools { top:auto; bottom:118px; right:10px; }
    #log { left:10px; right:10px; bottom:10px; width:auto; max-height:60px; }
    .note { display:none; }
  }
  @media (prefers-reduced-motion: reduce) { button { transition:none; } }

  #boot { position:fixed; inset:0; z-index:100; display:grid; place-content:center; justify-items:center; gap:14px; background:linear-gradient(#7cc8ff,#cdeeff 62%,#fff0d6); color:var(--ink); transition:opacity .35s ease; }
  #boot.gone { opacity:0; pointer-events:none; }
  #boot .spin { width:44px; height:44px; border-radius:50%; border:4px solid rgba(42,33,64,.18); border-top-color:#ff5a4e; animation:wvspin .9s linear infinite; }
  #boot p { margin:0; font-weight:800; font-size:18px; } #boot small { color:var(--muted); }
  @keyframes wvspin { to { transform:rotate(360deg); } }
  .lbl .say { display:none; }
  .lbl .name::before { content:""; display:inline-block; width:8px; height:8px; margin-right:6px; border-radius:50%; background:#a79fb8; }
  .lbl[data-mode=typing] .name::before { background:#f2b705; animation:wvpulse 1.2s ease-in-out infinite; }
  .lbl[data-mode=sleep] .name::before { background:#5cc8ff; } .lbl[data-mode=walk] .name::before { background:#5fcf6b; }
  .lbl[data-mode=hand] .name { border-color:#ff5a4e; } .lbl[data-mode=hand] .name::before { background:#ff5a4e; animation:wvpulse 1s ease-in-out infinite; }
  .lbl.hot .name { outline:3px solid #ff5a4e; outline-offset:1px; }
  @keyframes wvpulse { 50% { opacity:.3; } }
  #card { position:fixed; right:16px; bottom:56px; width:min(320px,calc(100vw - 32px)); max-height:42vh; overflow:auto; display:none; background:var(--paper); border:2px solid var(--line); border-radius:var(--r); box-shadow:0 10px 28px rgba(42,33,64,.18); padding:12px 14px; }
  #card.on { display:block; }
  #card h2 { margin:0 0 2px; font-size:15px; } #card .sub { color:var(--muted); font-size:12px; margin-bottom:8px; }
  #card .now { margin:0 0 8px; font-weight:600; overflow-wrap:anywhere; } #card ol { margin:0; padding:0; list-style:none; font-size:12px; color:var(--muted); } #card li { padding:2px 0; overflow-wrap:anywhere; }
  #card .hintx { margin-top:8px; font-size:11px; color:var(--muted); }
  .night #card { background:rgba(42,33,64,.94); color:#fff6e6; border-color:#fff6e6; } .night #card .sub, .night #card ol, .night #card .hintx { color:#d9cdf0; }
  @media (max-width:640px) { #card { bottom:76px; } }
  @media (prefers-reduced-motion: reduce) { #boot .spin, .lbl .name::before { animation:none !important; } }
</style>
</head>
<body>
<div id="boot" role="status" aria-live="polite"><div class="spin" aria-hidden="true"></div><p>Connecting to your fleet</p><small id="boot-sub">Reading tickets and agents</small></div>
<div class="ts ts-top"></div><div class="ts ts-bot"></div>
<div id="hud">
  <h1>Workov toy office</h1>
  <p>Everyone is at their desk. Drag to look around, wheel to zoom.</p>
  <div class="row"><span><i class="dot" style="background:#ffb870"></i>Draft</span><b>4</b></div>
  <div class="row"><span><i class="dot" style="background:#7cc6ff"></i>Plan</span><b>0</b></div>
  <div class="row"><span><i class="dot" style="background:#ff9fd2"></i>Design</span><b>0</b></div>
  <div class="row"><span><i class="dot" style="background:#a5e08a"></i>Todo</span><b>0</b></div>
  <div class="row"><span><i class="dot" style="background:#ffd84d"></i>Building</span><b>3</b></div>
  <div class="row"><span><i class="dot" style="background:#b9a2ff"></i>Review</span><b>0</b></div>
  <div class="row"><span><i class="dot" style="background:#7be0d4"></i>Deliver</span><b>0</b></div>
  <div class="row"><span><i class="dot" style="background:#8fe388"></i>Done</span><b>4</b></div>
</div>
<div id="tools"><button id="snd" aria-pressed="true">Sound on</button><button id="spin">Spin</button><button id="night">Night</button><button id="reset">Reset view</button></div>
<div id="log"><div>Activity</div></div>
<div class="note">Sample data. The real page would read the live board.</div>
<div id="labels"></div>
<div id="card" role="status" aria-live="polite"></div>

<script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './addons/loaders/GLTFLoader.js';
import { clone as cloneSkinned } from './addons/utils/SkeletonUtils.js';

// ---------- renderer, scene, camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 200);

const TICK = [];
function skyTex(a, b, c) { const cv = document.createElement('canvas'); cv.width = 4; cv.height = 256; const g = cv.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, a); gr.addColorStop(0.62, b); gr.addColorStop(1, c); g.fillStyle = gr; g.fillRect(0, 0, 4, 256); const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t; }
const hex = n => '#' + n.toString(16).padStart(6, '0');
function setSky(T) { if (scene.background && scene.background.dispose) scene.background.dispose(); scene.background = skyTex(hex(T.top), hex(T.sky), hex(T.low || T.sky)); scene.fog.color.set(T.fog); }
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const DAY = { top: 0x7cc8ff, sky: 0xcdeeff, low: 0xfff0d6, fog: 0xcdeeff, hemi: 1.0, sun: 1.55 }, NIGHT = { top: 0x1d1650, sky: 0x4a3a8c, low: 0xb08ad0, fog: 0x4a3a8c, hemi: 0.42, sun: 0.3 };
scene.fog = new THREE.Fog(DAY.fog, 55, 110); setSky(DAY);
const hemi = new THREE.HemisphereLight(0xffffff, 0xf0d9b5, DAY.hemi); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3dc, DAY.sun); sun.position.set(-14, 26, 18); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 20, bottom: -20, near: 1, far: 70 }); sun.shadow.bias = -0.0004; scene.add(sun);

// ---------- small helpers ----------
const mat = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.75, metalness: 0.02 }, o));
function box(w, h, d, c, x, y, z, parent = scene, o = {}) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c, o)); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m; }
function cyl(r, h, c, x, y, z, parent = scene, seg = 14) { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), mat(c)); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m; }
function sph(r, c, x, y, z, parent = scene) { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 18, 14), mat(c)); m.position.set(x, y, z); m.castShadow = true; parent.add(m); return m; }
const lamps = [];
// Kenney Furniture Kit (CC0): small GLB props, bundled in ./models. A missing file falls back to the box version.
const MODELS = {};
await Promise.all(['desk','chairDesk','computerScreen','computerKeyboard','computerMouse','pottedPlant','plantSmall1','lampRoundTable','bookcaseClosed','bookcaseOpen','rugRectangle','rugRound','loungeSofa','loungeChair','tableCoffee','speaker','cabinetTelevision'].map(n => new Promise(res => new GLTFLoader().load('./models/' + n + '.glb', g => { MODELS[n] = g.scene; res(); }, undefined, () => res()))));
// Kenney Mini Characters (CC0): rigged, with idle / walk / sit / interact / carry clips. A missing file falls back to the box people.
const CHARS = {};
await Promise.all(['female-a','female-b','female-c','female-d','female-e','female-f','male-a','male-b','male-c','male-d','male-e','male-f'].map(n => new Promise(res => new GLTFLoader().load('./models/chars/character-' + n + '.glb', g => { CHARS[n] = g; res(); }, undefined, () => res()))));
function glbPerson(name, height = 2.0) {
  const g = new THREE.Group(), src = CHARS[name];
  const model = cloneSkinned(src.scene);
  const box = new THREE.Box3().setFromObject(model), h = box.max.y - box.min.y || 1;
  model.scale.setScalar(height / h); model.position.y = -box.min.y * (height / h);
  model.traverse(o => { if (o.isMesh || o.isSkinnedMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; } });
  g.add(model);
  const mixer = new THREE.AnimationMixer(model), actions = {};
  for (const c of src.animations) { const a = mixer.clipAction(c); actions[c.name] = a; }
  g.userData = { glb: true, mixer, actions, cur: null, model };
  return g;
}
function playClip(u, name) {
  if (u.cur === name || !u.actions[name]) return;
  const next = u.actions[name].reset().fadeIn(0.25).play();
  if (u.cur && u.actions[u.cur]) u.actions[u.cur].fadeOut(0.25);
  u.cur = name; next.timeScale = name === 'interact-right' ? 1.0 : 1;
}
const FS = 2.7; // the kit's props are small: one scale makes them fit the room
function prop(name, x, y, z, ry = 0, s = FS, parent = scene) {
  const src = MODELS[name]; if (!src) return null;
  const m = src.clone(true); m.scale.setScalar(s); m.position.set(x, y, z); m.rotation.y = ry;
  m.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  parent.add(m); return m;
}

// ---------- floor and zones ----------
box(36, 0.4, 20, 0xfff1d6, 0, -0.2, -0.5);                 // base slab
const ZONES = [
  { n: 'Draft',    c: 0xffb870, x: -13,  z: -6,  w: 7,  d: 6 },
  { n: 'Plan',     c: 0x7cc6ff, x: -5.5, z: -6,  w: 7,  d: 6 },
  { n: 'Design',   c: 0xff9fd2, x: 2,    z: -6,  w: 7,  d: 6 },
  { n: 'Todo',     c: 0xa5e08a, x: 9.5,  z: -6,  w: 7,  d: 6 },
  { n: 'You',      c: 0xff8d7a, x: 15,   z: -6,  w: 4,  d: 6 },
  { n: 'Building', c: 0xffd84d, x: -8,   z: 3.5, w: 17, d: 9 },
  { n: 'Review',   c: 0xb9a2ff, x: 4,    z: 3.5, w: 6,  d: 9 },
  { n: 'Deliver',  c: 0x7be0d4, x: 9.5,  z: 3.5, w: 5,  d: 9 },
  { n: 'Done',     c: 0x8fe388, x: 15,   z: 3.5, w: 4,  d: 9 },
];
const zoneLabels = [];
for (const z of ZONES) {
  box(z.w, 0.06, z.d, z.c, z.x, 0.03, z.z, scene, (c => ({ roughness: 0.95, emissive: c, emissiveIntensity: 0.14 }))(z.c)).castShadow = false;
  const e = document.createElement('div'); e.className = 'zone'; e.textContent = z.n; document.getElementById('labels').append(e);
  zoneLabels.push({ el: e, pos: new THREE.Vector3(z.x, 0.08, z.z + z.d / 2 + 0.42) });
}
// back wall with windows
box(36, 5.2, 0.4, 0xffe0c4, 0, 2.6, -9.3);
for (let i = 0; i < 7; i++) {
  const x = -15 + i * 5;
  box(3.4, 2.6, 0.12, 0xbfe6ff, x, 2.9, -9.08, scene, { emissive: 0xa9dcff, emissiveIntensity: 0.5, roughness: 0.2 }).castShadow = false;
  box(3.6, 0.1, 0.16, 0xffffff, x, 4.25, -9.04); box(3.6, 0.1, 0.16, 0xffffff, x, 1.6, -9.04); box(0.1, 2.7, 0.16, 0xffffff, x, 2.9, -9.04);
}

// ---------- furniture ----------
function plant(x, z, s = 1) { if (prop('pottedPlant', x, 0, z, Math.random() * 6, 3.4 * s)) return; const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g); cyl(0.32 * s, 0.5 * s, 0xb26a45, 0, 0.25 * s, 0, g); for (let i = 0; i < 5; i++) { const a = i * 1.26; sph(0.34 * s, 0x4f9a55, Math.cos(a) * 0.22 * s, (0.8 + (i % 2) * 0.18) * s, Math.sin(a) * 0.22 * s, g); } }
function lamp(x, z, y = 1.02) { if (MODELS.lampRoundTable) { prop('lampRoundTable', x, y, z, 0, 2.2); const l = new THREE.PointLight(0xffc27a, 0, 7, 2); l.position.set(x, y + 0.7, z); scene.add(l); lamps.push(l); return; } const g = new THREE.Group(); g.position.set(x, y, z); scene.add(g); cyl(0.14, 0.04, 0x333, 0, 0, 0, g); const arm = box(0.04, 0.5, 0.04, 0x333, 0, 0.25, 0, g); arm.rotation.z = 0.35; const hd = cyl(0.12, 0.16, 0xe8742a, -0.1, 0.52, 0, g); hd.rotation.z = 0.5; const l = new THREE.PointLight(0xffc27a, 0, 7, 2); l.position.set(0, 0.5, 0.2); g.add(l); lamps.push(l); }
function desk(x, z, w = 2.6) {
  const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);
  if (MODELS.desk) { // the kit's models have their origin at a corner: shift them so the desk is centred on (x, z)
    const k = new THREE.Group(); k.position.set(0.96, 0, -0.5); g.add(k);
    prop('desk', 0, 0, 0, Math.PI, FS, k); prop('computerScreen', -0.43, 1.03, 0.25, Math.PI, FS, k); prop('computerKeyboard', -0.43, 1.03, 0.0, Math.PI, FS, k); prop('computerMouse', 0.35, 1.03, 0.0, Math.PI, FS, k); return g; }
  box(w, 0.1, 1.3, 0xb9bec7, 0, 1.0, 0, g); box(0.1, 1.0, 1.1, 0x8d939c, -w / 2 + 0.1, 0.5, 0, g); box(0.1, 1.0, 1.1, 0x8d939c, w / 2 - 0.1, 0.5, 0, g);
  const lap = new THREE.Group(); lap.position.set(0, 1.06, 0.1); g.add(lap); box(0.8, 0.04, 0.55, 0x2d3138, 0, 0, 0, lap); const scr = box(0.8, 0.5, 0.04, 0x2d3138, 0, 0.27, -0.27, lap); scr.rotation.x = -0.18;
  const face = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.4), new THREE.MeshBasicMaterial({ color: 0x78c2ff })); face.position.set(0, 0, 0.025); scr.add(face); face.userData.screen = true; screens.push(face);
  return g;
}
const screens = [];
function chair(x, z) { if (prop('chairDesk', x - 0.45, 0, z + 0.42, 0, FS)) return; const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g); box(0.7, 0.1, 0.7, 0x3b4252, 0, 0.62, 0, g); box(0.7, 0.8, 0.1, 0x3b4252, 0, 1.0, -0.32, g); cyl(0.05, 0.6, 0x222, 0, 0.3, 0, g); box(0.6, 0.05, 0.06, 0x222, 0, 0.04, 0, g); }

// ---------- people ----------
const SKIN = [0xf1c8a5, 0xd9a47c, 0xb97a54, 0x8d5a3b];
function person({ shirt, hair, skin = SKIN[0], standing = false }) {
  const g = new THREE.Group();
  const body = new THREE.Group(); g.add(body);
  const torso = cyl(0.34, 0.85, shirt, 0, standing ? 1.55 : 1.1, 0, body); torso.scale.set(1, 1, 0.8);
  const head = new THREE.Group(); head.position.set(0, standing ? 2.3 : 1.85, 0); body.add(head);
  sph(0.27, skin, 0, 0, 0, head); const h = sph(0.285, hair, 0, 0.07, -0.03, head); h.scale.set(1, 0.85, 1);
  box(0.06, 0.06, 0.04, 0x222, -0.1, 0.02, 0.26, head); box(0.06, 0.06, 0.04, 0x222, 0.1, 0.02, 0.26, head);
  const arms = [];
  for (const s of [-1, 1]) { const sh = new THREE.Group(); sh.position.set(s * 0.46, standing ? 1.9 : 1.45, 0); body.add(sh); const a = cyl(0.11, 0.62, shirt, 0, -0.28, 0, sh); a.castShadow = true; sph(0.11, skin, 0, -0.62, 0, sh); arms.push(sh); }
  const legs = [];
  if (standing) for (const s of [-1, 1]) { const l = new THREE.Group(); l.position.set(s * 0.17, 1.15, 0); g.add(l); cyl(0.13, 0.9, 0x3a4256, 0, -0.45, 0, l); box(0.22, 0.12, 0.34, 0x222, 0, -0.93, 0.06, l); legs.push(l); }
  g.userData = { body, head, arms, legs, standing };
  return g;
}

// ---------- the cast ----------
const agents = [];
// which Kenney character each agent is, and whether it works standing at its desk or sits on its chair
const CM = { 'worker 1': ['male-a', 'sit'], 'worker 2': ['female-b', 'sit'], 'worker 3': ['male-c', 'sit'], tester: ['male-d', 'sit'], planner: ['female-c', 'sit'],

    for (const t of tickets) { const o = prev.t[t.key]; if (o && o !== t.stage) { pushLog(t.id + ' moved to ' + t.stage); moved = true; if (t.stage === 'Done') won = true; } else if (!o && prev.seen) pushLog(t.id + ' appeared in ' + t.stage); }
    let started = false, finished = false;
    for (const w of builders) if (!prev.w.has(w.ticket)) { pushLog('a worker started ' + w.ticket); started = true; }
    for (const k of prev.w) if (!builders.find(w => w.ticket === k)) { pushLog('a worker finished ' + k); finished = true; }
    if (won) SFX.win(); else if (moved) SFX.move();
    if (started) SFX.pop(); if (finished) SFX.done();
    if (needs.length > prev.needs) SFX.alert();
    if (busy && !prev.busy) SFX.whoosh();
    if (R && R.text && R.text !== lastRouter) pushLog('router: ' + R.text.slice(0, 70));
  } else pushLog('connected: ' + tickets.length + ' tickets, ' + builders.length + ' workers busy');
  lastRouter = (R && R.text) || '';
  prev = { t: Object.fromEntries(tickets.map(t => [t.key, t.stage])), w: new Set(builders.map(w => w.ticket)), seen: true, needs: needs.length, busy };
  if (noteEl) noteEl.textContent = 'Live. Updated ' + new Date().toTimeString().slice(0, 8);
}
async function loadModels() {
  try {
    const r = await api('/api/agent-roster'), pick = (k) => { const a = (r.agents || []).find(x => x.runtime === r.harness && x.agent.toLowerCase().includes(k)) || (r.agents || []).find(x => x.agent.toLowerCase().includes(k)); return a ? shortModel(a.model) : ''; };
    roleModel = { worker: pick('worker') };
    for (const [n, k] of [['tester', 'tester'], ['planner', 'plan'], ['designer', 'design'], ['reviewer', 'review'], ['router', 'router'], ['watchdog', 'watchdog']]) { const m = pick(k), a = byName(n); if (m && a) setName(a, n, m); }
  } catch (e) { /* the models stay as the sample shows them */ }
}
(async () => {
  const hideBoot = () => { const b = document.getElementById('boot'); if (b) { b.classList.add('gone'); setTimeout(() => b.remove(), 450); } };
  const sub = document.getElementById('boot-sub'), say = (t) => { if (sub) sub.textContent = t; };
  const slow = setTimeout(() => say('Still connecting, the dashboard is slow to answer'), 7000);
  // Sample data is only for the page opened on its own (no dashboard behind it). With a dashboard, the loader stays until the real data arrives.
  for (let tries = 0; ; tries++) {
    try { await pollLive(); clearTimeout(slow); hideBoot(); loadModels(); setInterval(() => pollLive().catch(() => { if (noteEl) noteEl.textContent = 'Live feed paused, retrying.'; }), 4000); return; }
    catch (e) {
      if (e instanceof TypeError || / (404|405)$/.test(String(e && e.message))) { clearTimeout(slow); hideBoot(); for (let i = 0; i < 5; i++) logLine(); sampleTimer = setInterval(logLine, 4500); return; }
      if (tries >= 3) say('Could not read your fleet yet (' + String(e && e.message || e).slice(0, 80) + '). Retrying...');
      await new Promise(r => setTimeout(r, tries < 10 ? 2500 : 8000));
    }
  }
})();

// ---------- loop ----------
const v = new THREE.Vector3();
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const clock = new THREE.Clock();
function place(el, pos) { v.copy(pos).project(camera); const ok = v.z < 1; el.style.display = ok ? '' : 'none'; el.style.left = ((v.x * 0.5 + 0.5) * innerWidth) + 'px'; el.style.top = ((-v.y * 0.5 + 0.5) * innerHeight) + 'px'; }
// ---------- who is who: hover or click a person to read what they are doing ----------
function sayTo(a, text) { if (a.say.textContent === text) return; a.say.textContent = text; (a.hist = a.hist || []).unshift(text); if (a.hist.length > 7) a.hist.pop(); }
const card = document.getElementById('card'); let hotA = null, pinA = null, downAt = null;
const MODE_LABEL = { typing: 'Working', idle: 'Idle', sleep: 'Asleep', hand: 'Needs your answer', walk: 'On the move' };
function pickAgent(x, y) { let best = null, bd = 56 * 56; for (const a of agents) { v.set(a.p.position.x, a.top * 0.55, a.p.position.z).project(camera); if (v.z > 1) continue; const px = (v.x * 0.5 + 0.5) * innerWidth, py = (-v.y * 0.5 + 0.5) * innerHeight, d = (px - x) ** 2 + (py - y) ** 2; if (d < bd) { bd = d; best = a; } } return best; }
function paintCard() {
  const a = pinA || hotA; card.classList.toggle('on', !!a);
  for (const x of agents) x.lbl.classList.toggle('hot', x === a);
  if (!a) return; card.textContent = '';
  const nm = a.lbl.querySelector('.name'), mk = (tag, text, cls) => { const e = document.createElement(tag); e.textContent = text; if (cls) e.className = cls; return e; };
  const ol = document.createElement('ol'); (a.hist || []).slice(1).forEach(t => ol.append(mk('li', t)));
  card.append(mk('h2', nm.childNodes[0] ? nm.childNodes[0].textContent : a.o.name), mk('div', (nm.querySelector('small') || {}).textContent ? nm.querySelector('small').textContent + ' · ' + (MODE_LABEL[a.p.userData.mode] || '') : (MODE_LABEL[a.p.userData.mode] || ''), 'sub'), ...(a.detail ? [mk('div', a.detail, 'sub')] : []), mk('p', a.say.textContent || 'Nothing yet', 'now'), ol, mk('div', pinA ? 'Pinned. Click empty space or press Esc to close.' : 'Click to keep this open.', 'hintx'));
}
renderer.domElement.addEventListener('pointermove', e => { if (drag) return; const a = pickAgent(e.clientX, e.clientY); if (a !== hotA) { hotA = a; paintCard(); } renderer.domElement.style.cursor = a ? 'pointer' : ''; });
renderer.domElement.addEventListener('pointerdown', e => { downAt = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('click', e => { if (downAt && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 5) return; const a = pickAgent(e.clientX, e.clientY); pinA = a && a !== pinA ? a : null; hotA = a; paintCard(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && pinA) { pinA = null; paintCard(); } });
setInterval(() => { if (pinA || hotA) paintCard(); }, 800);

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (spin) cam.az += dt * 0.25;
  camera.position.set(target.x + cam.r * Math.sin(cam.pol) * Math.sin(cam.az), target.y + cam.r * Math.cos(cam.pol), target.z + cam.r * Math.sin(cam.pol) * Math.cos(cam.az));
  camera.lookAt(target);
  for (const f of TICK) f(t);
  for (const s of screens) s.material.color.setHSL(0.58, 0.8, 0.55 + Math.sin(t * 3 + s.id) * 0.05);
  for (const a of agents) {
    const u = a.p.userData, arms = u.arms, head = u.head;
    if (u.glb) {
      u.mixer.update(dt);
      if (u.mode === 'walk') {
        const tgt = PATH[rt.i], dx = tgt[0] - a.p.position.x, dz = tgt[1] - a.p.position.z, dist = Math.hypot(dx, dz);
        if (dist > 0.08) { const sp = 2.8 * dt; a.p.position.x += dx / dist * Math.min(sp, dist); a.p.position.z += dz / dist * Math.min(sp, dist); a.p.rotation.y = Math.atan2(dx, dz); playClip(u, carry.visible ? 'holding-both' : 'walk'); sayTo(a, tgt[2]); }
        else { playClip(u, carry.visible ? 'holding-both' : 'idle'); rt.wait -= dt; if (rt.wait <= 0) { rt.i = (rt.i + 1) % PATH.length; rt.wait = 1.6; if (rt.i === 0) carry.visible = true; if (rt.i === 3) carry.visible = false; } }
      } else {
        playClip(u, a.clip);
        if (u.mode === 'sleep') { u.model.rotation.x = 0.28 + Math.sin(t * 1.2) * 0.03; a.say.classList.add('zzz'); }
        if (a.msgs.length && t > a.next) { sayTo(a, a.msgs[a.mi++ % a.msgs.length]); a.next = t + 2.2 + Math.random() * 2.5; }
      }
      a.lbl.dataset.mode = u.mode; place(a.lbl, v.set(a.p.position.x, a.top, a.p.position.z));
      continue;
    }
    if (u.mode === 'typing') { arms[0].rotation.x = -1.25 + Math.sin(t * 14 + u.phase) * 0.12; arms[1].rotation.x = -1.25 + Math.sin(t * 13 + u.phase + 1.7) * 0.12; head.rotation.x = Math.sin(t * 1.6 + u.phase) * 0.07; }
    else if (u.mode === 'idle') { arms.forEach(x => x.rotation.x = -0.5); head.rotation.y = Math.sin(t * 0.5 + u.phase) * 0.5; u.body.position.y = Math.sin(t * 1.4 + u.phase) * 0.012; }
    else if (u.mode === 'sleep') { arms.forEach(x => x.rotation.x = -0.9); head.rotation.x = 0.55 + Math.sin(t * 1.2) * 0.04; head.position.y = 1.78; }
    else if (u.mode === 'hand') { arms[1].rotation.z = -2.7 + Math.sin(t * 6) * 0.25; arms[1].rotation.x = 0; arms[0].rotation.x = -1.2; head.rotation.y = Math.sin(t * 1.5) * 0.3; }
    if (u.mode === 'walk') {
      const tgt = PATH[rt.i], dx = tgt[0] - a.p.position.x, dz = tgt[1] - a.p.position.z, dist = Math.hypot(dx, dz);
      if (dist > 0.08) { const sp = 2.6 * dt; a.p.position.x += dx / dist * Math.min(sp, dist); a.p.position.z += dz / dist * Math.min(sp, dist); a.p.rotation.y = Math.atan2(dx, dz); const sw = Math.sin(t * 9) * 0.6; u.legs[0].rotation.x = sw; u.legs[1].rotation.x = -sw; arms[0].rotation.x = -sw * 0.8; arms[1].rotation.x = sw * 0.8; a.p.position.y = Math.abs(Math.sin(t * 9)) * 0.05; sayTo(a, tgt[2]); }
      else { u.legs.forEach(l => l.rotation.x = 0); arms.forEach(x => x.rotation.x = carry.visible ? -1.1 : -0.2); rt.wait -= dt; if (rt.wait <= 0) { rt.i = (rt.i + 1) % PATH.length; rt.wait = 1.6; if (rt.i === 0) carry.visible = true; if (rt.i === 3) carry.visible = false; } }
    }
    if (u.mode === 'idle' && u.standing) { u.legs.forEach(l => l.rotation.x = 0); }
    // bubble text
    if (a.msgs.length && u.mode !== 'walk' && t > a.next) { sayTo(a, a.msgs[a.mi++ % a.msgs.length]); a.next = t + 2.2 + Math.random() * 2.5; }
    if (u.mode === 'sleep') { a.say.classList.add('zzz'); }
    a.lbl.dataset.mode = u.mode; place(a.lbl, v.set(a.p.position.x, a.top, a.p.position.z));
  }

}
frame();
