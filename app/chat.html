<!doctype html>
<html lang="en" data-mode="dark" data-theme="tmzm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src data: blob:; connect-src 'self'">
<title>Workeve Chat</title>
<script src="chat-boot.js"></script>
<link rel="stylesheet" href="chat.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-term" viewBox="0 0 24 24"><path d="m4 17 6-6-6-6"/><path d="M12 19h8"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4L15 7"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6z"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
</defs></svg>
<div class="app">
  <header class="top">
    <div class="brand"><span class="logo" role="img" aria-label="Workeve"></span>Workeve Chat</div>
    <button class="pill" id="folder" title="Folder Claude works in"><svg><use href="#i-folder"/></svg><span id="folderName"></span></button>
    <button class="pill" id="claudeChip" title="Claude account"><span class="dot off" id="claudeDot"></span><span id="claudeText">Claude</span></button>
    <span class="grow"></span>
    <span class="work" id="work"><span class="spin"></span>Working</span>
    <select id="theme" aria-label="Theme"><option value="andon">Andon</option><option value="cyberpunk">Cyberpunk</option><option value="tmzm">Tmzm</option></select>
    <button class="icon-btn" id="mode" aria-label="Toggle light or dark"><svg><use href="#i-sun"/></svg></button>
    <button class="icon-btn" id="dash" aria-label="Open the fleet dashboard"><svg><use href="#i-grid"/></svg></button>
  </header>

  <aside class="side">
    <button class="newchat" id="new"><svg><use href="#i-plus"/></svg>New chat</button>
    <section><h4>Past chats</h4><div id="sessions"><div class="kv" style="color:var(--faint)">none yet</div></div></section>
    <section><h4>Commands &amp; skills</h4><div id="cmds"><div class="kv" style="color:var(--faint)">appear after the first message</div></div></section>
    <section><h4>MCP servers</h4><div id="mcp"><div class="kv" style="color:var(--faint)">appear after the first message</div></div></section>
  </aside>

  <main class="main">
    <div class="scroll" id="scroll"><div class="col" id="log" role="log" aria-live="polite"></div></div>
    <button class="icon-btn jump" id="jump" aria-label="Jump to the latest message"><svg style="transform:rotate(90deg)"><use href="#i-chev"/></svg></button>
    <div class="composer">
      <div class="menu" id="folderMenu" role="menu" aria-label="Working folder" style="position:fixed;bottom:auto;left:16px;top:60px;width:min(520px,calc(100% - 32px));max-height:70vh;overflow:auto;z-index:70"></div>
      <div class="menu" id="pop" role="menu" style="position:fixed;bottom:auto;z-index:80;width:min(340px,calc(100% - 24px));max-height:60vh;overflow:auto"></div>
      <div class="menu" id="menu" role="listbox" aria-label="Slash commands"></div>
      <div class="box" id="drop">
        <div class="chips" id="chips"></div>
        <textarea class="input" id="box" rows="1" aria-label="Message" placeholder="Ask anything. Type / for commands, drop or paste files and images."></textarea>
        <div class="tools">
          <input type="file" id="fileIn" multiple hidden>
          <button class="icon-btn" id="attach" aria-label="Attach files or images"><svg><use href="#i-clip"/></svg></button>
          <button class="chip2" id="modeChip" aria-haspopup="menu" title="Permission mode (Shift+Tab cycles)"><span id="modeText">Manual</span></button>
          <button class="chip2" id="modelChip" aria-haspopup="menu" title="Model"><span id="modelText">Default model</span></button>
          <button class="chip2" id="thinkChip" aria-haspopup="menu" title="Extended thinking"><span id="thinkText">Thinking: normal</span></button>
          <button class="chip2" id="ctxChip" aria-haspopup="dialog" title="Context used. Click for usage."><span class="ring" id="ctxRing"></span><span id="ctxText">0%</span></button>
          <button class="send" id="go" aria-label="Send"><svg id="goIcon"><use href="#i-send"/></svg></button>
        </div>
      </div>
      <div class="hint"><span><kbd>Enter</kbd> send</span><span><kbd>Shift</kbd>+<kbd>Enter</kbd> new line</span><span><kbd>/</kbd> commands</span><span><kbd>Esc</kbd> stop</span></div>
    </div>
  </main>
</div>
<script src="chat-md.js"></script>
<script src="chat.js"></script>
</body>
</html>
