<!doctype html>
<html lang="en" data-theme="tmzm" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Workerov</title>
<script src="chat-boot.js"></script>
<link rel="stylesheet" href="chat.css">
<style>
body{display:block;overflow:auto;background:var(--bg)}
.wrap{max-width:680px;margin:0 auto;padding:56px 24px 40px}
.logo{width:44px;height:44px;border-radius:12px;font-size:22px;margin-bottom:18px}
h1{margin:0 0 4px;font-size:1.7em;letter-spacing:-.01em}
.lead{color:var(--dim);margin:0 0 22px;min-height:1.6em}
.step{display:flex;gap:14px;align-items:flex-start;padding:14px;margin-bottom:10px;border:1px solid var(--line);border-radius:calc(12px*var(--rk));background:var(--surface);transition:border-color .2s}
.step.primary{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.mark{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;background:var(--raised);color:var(--faint)}
.ok .mark{background:var(--ok);color:#06210f}.bad .mark{background:var(--bad);color:#2a0a07}
.info{flex:1;min-width:0}.info b{display:block}.info span{color:var(--dim);font-size:13px;word-break:break-word}
.opt{font-size:11px;color:var(--faint);margin-left:6px;font-weight:400}
.foot{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}
.foot .grow{flex:1}.hint{color:var(--faint);font-size:12.5px}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin:0 0 22px}
.bar i{display:block;height:100%;width:35%;background:var(--accent);animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%;opacity:.5}}
</style>
</head>
<body>
<div class="wrap">
  <span class="logo" role="img" aria-label="Workerov"></span>
  <h1 id="title">Workerov</h1>
  <script>document.getElementById('title').textContent = window.APP_NAME; document.querySelector('.logo').setAttribute('aria-label', window.APP_NAME); document.title = window.APP_NAME;</script>
  <p class="lead" id="lead">Checking your setup…</p>
  <div class="bar" id="bar"><i></i></div>
  <div id="list" role="list"></div>
  <div class="foot" id="foot" hidden>
    <button class="btn" id="recheck">Check again</button>
    <button class="btn" id="notify">Test notification</button>
    <span class="grow"></span>
    <span class="hint" id="msg"></span>
    <button class="btn primary" id="go" hidden>Open the dashboard</button>
  </div>
</div>
<script src="start-page.js"></script>
</body>
</html>
